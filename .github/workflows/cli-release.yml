name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: sigstore/cosign-installer@v3
      - name: Run tests
        run: go test ./...
      - name: Compute semver tag
        id: tag
        run: |
          # OSS GoReleaser requires a valid semver tag pointing to the current
          # commit. Strip the `cli-` prefix and also create a local lightweight
          # tag with the bare semver pointing at the same commit so GoReleaser's
          # tag-on-HEAD check is satisfied.
          full="${GITHUB_REF#refs/tags/}"
          short="${full#cli-}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          git tag -f "$short"
          echo "Tag: $full → semver: $short"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: apps/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.short }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Regenerate install.sh
        working-directory: scripts
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.R2_UPLOAD_TOKEN }}" \
            -F "file=@install.sh" \
            https://thepull.dev/api/internal/install-script || true
