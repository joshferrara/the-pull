version: 2
project_name: pull

# Tags are prefixed `cli-v*` in the monorepo so they don't collide with web
# app tags. The cli-release.yml workflow sets `GORELEASER_CURRENT_TAG` to the
# semver portion (e.g. v0.1.0) before invoking goreleaser; the OSS edition
# doesn't have the `monorepo:` block from GoReleaser Pro, so the workflow
# does the prefix strip.

before:
  hooks:
    - go mod tidy

builds:
  - id: pull
    main: ./
    binary: pull
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

release:
  github:
    owner: joshferrara
    name: the-pull
  prerelease: auto
  draft: false

homebrew_casks:
  - repository:
      owner: joshferrara
      name: homebrew-the-pull
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://thepull.dev"
    description: "The Pull — daily AI brief for developers"
    license: "MIT"
    binaries:
      - "pull"

scoops:
  - repository:
      owner: joshferrara
      name: scoop-the-pull
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://thepull.dev"
    description: "The Pull — daily AI brief for developers"
    license: "MIT"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
